<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene Creator</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <section id="viewport">
        <div id="stage">
          <div id="steady" class="badge">Loading…</div>
          <div id="stageShield" hidden></div>
        </div>
      </section>

      <section id="timeline">
        <input id="timeSlider" type="range" min="0" max="1" step="0.05" value="0" disabled aria-label="Scene time" />
        <div id="timeLabel">—</div>
      </section>

      <section id="recordRow">
        <button id="recordBtn" type="button" disabled>● Record</button>
        <button id="cancelBtn" type="button" hidden>Cancel</button>
        <div id="progressBar" hidden><div id="progressFill"></div></div>
        <div id="recordStatus"></div>
      </section>

      <section id="bottom">
        <div id="mapColumn">
          <div id="placeSearch"></div>
          <div id="minimap"></div>
          <div class="row map-footer">
            <div id="pickHint"></div>
            <button id="fitMapBtn" type="button">Fit map</button>
          </div>
        </div>

        <section id="controls">
          <details id="pathPanel" open>
            <summary><span class="summary-title">Path</span><span id="pathSummary" class="summary-info"></span></summary>
            <div class="row">
              <label for="sceneType">Scene</label>
              <select id="sceneType" class="grow"></select>
            </div>
            <div id="sceneDescription"></div>
            <div id="paramsForm"></div>
            <div class="row">
              <button id="resetBtn" type="button">Reset to defaults</button>
              <button id="frameBtn" type="button">Frame scene</button>
            </div>
            <div id="summary"></div>
          </details>

          <details id="settings">
            <summary><span class="summary-title">Output &amp; quality</span><span id="settingsSummary" class="summary-info"></span></summary>
            <div id="presets" class="row"></div>
            <div id="settingsForm"></div>
            <div class="row" style="margin-top: 6px">
              <button id="resetSettingsBtn" type="button">Reset to defaults</button>
            </div>
            <div id="renderInfo"></div>
          </details>

          <div id="status">Loading…</div>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
